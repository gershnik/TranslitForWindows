name: Build

on:
  workflow_dispatch:
  push:
    branches: 
      - '*'
      - '*/**'
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'LICENSE'
      - 'doc/**'
      - '.gitignore'
      - '.gitattributes'
      - '.github/workflows/publish.yml'
      

jobs:
  main:
    runs-on: windows-2025-vs2026
    
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'

    - name: Install WiX
      run: |
        dotnet tool install --global wix --version 6.*
        $wix_version = (wix --version).Trim()
        wix extension add -g WixToolset.Util.wixext/$wix_version
        wix extension add -g WixToolset.UI.wixext/$wix_version

    - name: Get Version
      shell: bash
      run: |
        version=`python .tools/get-version.py`
        echo Version: $version
        echo "GH_BUILD_VERSION=$version" >> $GITHUB_ENV

    - name: Fetch dependencies
      shell: bash
      run: python fetch.py

    - name: Build
      shell: bash
      run: python build.py

    - name: Archive x64 artifact
      uses: actions/upload-artifact@v7
      with:
        name: Translit-${{ env.GH_BUILD_VERSION }}-x64.msi
        path: build\Installers\Release\Translit-x64.msi
        retention-days: 3

    - name: Archive arm64 artifact
      uses: actions/upload-artifact@v7
      with:
        name: Translit-${{ env.GH_BUILD_VERSION }}-arm64.msi
        path: build\Installers\Release\Translit-arm64.msi
        retention-days: 3
