<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <style>
        :root {
            --fg-secondary: #5f5f5f;
            --accent: #3d74e6;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --fg-secondary: #b5b5b5;
                --accent: #7aa2f7;
            }
        }

        html {
            overflow: hidden;
        }

        body {
            margin: 0px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 14px;
        }

        #content {
            padding: 16px 20px;
        }

        #header {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        #header img {
            flex: none;
            border-radius: 10%;
        }

        #name {
            font-size: 28px;
            font-weight: 600;
            line-height: 1.15;
            margin-left: -1px;
        }

        #version, #copyright {
            margin-top: 2px;
            padding-left: 2px;
        }

        #copyright {
            font-size: 12px;
            color: var(--fg-secondary);
        }

        #info {
            margin: 16px 0 0 0;
        }

        a {
            color: var(--accent);
        }
    </style>
</head>
<body>
    <div id="content">
        <div id="header">
            <img width="64" height="64" src="%ICONURL%" alt="">
            <div>
                <div id="name">Translit</div>
                <div id="version">Version %VERSION%</div>
                <div id="copyright">%COPYRIGHT%</div>
            </div>
        </div>
        <p id="info">
            More information and updates can be found at the <a href="https://github.com/gershnik/TranslitForWindows">GitHub homepage</a>.
        </p>
    </div>
</body>
</html>
